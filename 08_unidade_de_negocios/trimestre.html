<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel TV - Performance Trimestral (RCM & Glosas)</title>
    
    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/canais.css">
    <link rel="stylesheet" href="css/trimestre.css">
    <script src="js/echarts.min.js"></script>

    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-dark: #121826;
            --gold: #cb9727;
            --gold-light: #f5d372;
            --green-neon: #00d26a;
            --red-neon: #ff2424;
            --yellow-neon: #ffd600;
        }
        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .header {
            background: rgba(18, 24, 38, 0.95);
            border-bottom: 2px solid rgba(203, 151, 39, 0.3);
            padding: 8px 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 6px;
        }
        .nav-tabs-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .tab-btn {
            background: #182030;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .tab-btn:hover, .tab-btn.active {
            background: linear-gradient(135deg, #cb9727 0%, #a6781b 100%);
            color: #000;
            border-color: #cb9727;
            box-shadow: 0 0 10px rgba(203, 151, 39, 0.4);
        }
        .tab-btn.btn-voltar {
            background: #252830;
            color: #f5d372;
            border-color: rgba(203, 151, 39, 0.5);
        }
        .tab-btn.btn-voltar:hover {
            background: #cb9727;
            color: #000;
        }
        .header-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .filters-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        select, .btn-action {
            background: #182030;
            border: 1px solid rgba(203, 151, 39, 0.4);
            color: #f5d372;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            cursor: pointer;
        }
        .btn-action {
            background: linear-gradient(135deg, #cb9727 0%, #a6781b 100%);
            color: #000;
            border: none;
        }
        .header-meta-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.72rem;
            color: #94a3b8;
        }
        .clock {
            font-weight: 800;
            font-size: 0.9rem;
            color: #fff;
            letter-spacing: 1px;
        }
        /* Layout Trimestral Responsivo TV */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }
        .dashboard-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 960px) {
            body {
                overflow: hidden;
            }
            .dashboard-container {
                height: 100vh;
                overflow: hidden;
            }
            .trimestre-grid {
                flex: 1;
                min-height: 0;
                height: 100%;
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding: 6px 16px 10px;
                box-sizing: border-box;
                overflow: hidden;
                max-width: 1800px;
                width: 100%;
                margin: 0 auto;
            }
            .row-top-2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                flex: 1;
                min-height: 0;
                height: 50%;
            }
            .row-bottom-3 {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                flex: 1;
                min-height: 0;
                height: 50%;
            }
        }
        @media (max-width: 959px) {
            .trimestre-grid {
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .row-top-2, .row-bottom-3 {
                display: grid;
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .tri-card {
                min-height: 220px;
            }
        }
        .tri-card {
            background: linear-gradient(180deg, #131722 0%, #0d1017 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 12px 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
            height: 100%;
            min-height: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        .tri-card:hover {
            transform: translateY(-2px);
            border-color: rgba(203, 151, 39, 0.5);
        }
        .tri-card.meta-batida {
            border: 2px solid #00d26a;
            box-shadow: 0 0 16px rgba(0, 210, 106, 0.35);
        }
        .tri-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        .tri-card-title {
            text-align: left;
            font-size: 0.82rem;
            font-weight: 800;
            color: #f5d372;
            letter-spacing: 0.5px;
            margin: 0;
            text-transform: uppercase;
        }
        .badge-meta {
            display: none;
            background: rgba(0, 210, 106, 0.15);
            border: 1px solid #00d26a;
            color: #00d26a;
            font-size: 0.62rem;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 10px;
            text-align: center;
            letter-spacing: 0.5px;
            white-space: nowrap;
            animation: pulse-green 2s infinite;
        }
        .tri-card.meta-batida .badge-meta {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .tri-chart {
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 110px;
        }
        .tri-quarter-badges {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .tri-pill {
            background: #182030;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 2px 2px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tri-pill:hover, .tri-pill.selected {
            border-color: #cb9727;
            background: #222b40;
        }
        .tri-pill .label {
            font-size: 0.60rem;
            color: #94a3b8;
            font-weight: 700;
            display: block;
        }
        .tri-pill .val {
            font-weight: 800;
            font-size: 0.70rem;
            display: block;
        }
        .val-success { color: #00d26a; }
        .val-warning { color: #ffd600; }
        .val-danger { color: #ff2424; }
        .sub-nav-tri {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(10, 14, 23, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
        }
        .btn-tri-sel {
            background: #182030;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 5px 14px;
            border-radius: 4px;
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-tri-sel.active, .btn-tri-sel:hover {
            background: #cb9727;
            color: #000;
            border-color: #cb9727;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <div class="nav-tabs-container">
                    <a href="index.html" class="tab-btn"><i class="fa-solid fa-gauge-high"></i> Unidade de Negócios</a>
                    <a href="trimestre.html" class="tab-btn active"><i class="fa-solid fa-chart-pie"></i> Trimestral (Glosas & RCM)</a>
                    <a href="mapa_brasil.html" class="tab-btn" style="color:#ffd700;"><i class="fa-solid fa-map-location-dot"></i> Mapa Brasil</a>
                    <a href="paises.html" class="tab-btn"><i class="fa-solid fa-earth-americas"></i> Países & Global</a>
                    <a href="../index.html" class="tab-btn btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar ao Portfólio</a>
                </div>
                <div class="header-actions-right" style="display:flex; align-items:center; gap:8px;">
                    <div class="auto-tv-indicator" id="auto-tv-badge" onclick="toggleAutoTV()" style="cursor:pointer;" title="Clique para pausar/retomar alternância automática">
                        <div class="pulse-dot"></div>
                        <span id="auto-tv-text">AUTO-TV: ATIVA (25s)</span>
                    </div>
                    <button class="btn-action" onclick="toggleFullScreen()"><i class="fa-solid fa-expand"></i> Tela Cheia</button>
                </div>
            </div>

            <div class="header-bottom">
                <div class="filters-row">
                    <select id="filter-year" onchange="updateAll()">
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026" selected>2026</option>
                    </select>
                    <button class="btn-action" onclick="updateAll()"><i class="fa-solid fa-rotate"></i> Atualizar</button>
                </div>
                <div class="header-meta-info">
                    <div class="clock" id="clock">11:45:00</div>
                    <div class="date" id="date">05/11/2026</div>
                    <div class="last-update">Última atualização: 11:43:22</div>
                    <div class="next-update">Próxima em: 07:25</div>
                </div>
            </div>
        </header>

        <!-- Seletor de Trimestres (Idêntico à Imagem 2 do usuário) -->
        <div class="sub-nav-tri">
            <button id="btn-tri-1" class="btn-tri-sel" onclick="selectQuarter('1T')">1º TRI (JAN-MAR)</button>
            <button id="btn-tri-2" class="btn-tri-sel" onclick="selectQuarter('2T')">2º TRI (ABR-JUN)</button>
            <button id="btn-tri-3" class="btn-tri-sel active" onclick="selectQuarter('3T')">3º TRI (JUL-SET)</button>
            <button id="btn-tri-4" class="btn-tri-sel" onclick="selectQuarter('4T')">4º TRI (OUT-DEZ)</button>
        </div>

        <!-- Main Layout: Linha 1 com 2 Cards + Linha 2 com 3 Cards (Total 5 Cards como solicitado) -->
        <main class="trimestre-grid">
            <!-- Linha Superior: 2 Cards (CONVENIO e GLOSA) -->
            <div class="row-top-2">
                <div class="tri-card" id="card-tri-convenio">
                    <div class="tri-card-header"><div class="tri-card-title">CONVÊNIO</div><div class="badge-meta"><i class="fa-solid fa-trophy"></i> ALCANÇADO</div></div>
                    <div class="tri-chart" id="chart-convenio"></div>
                    <div class="tri-quarter-badges" id="badges-convenio"></div>
                </div>
                <div class="tri-card" id="card-tri-glosa">
                    <div class="tri-card-header"><div class="tri-card-title">GLOSA</div><div class="badge-meta"><i class="fa-solid fa-trophy"></i> ALCANÇADO</div></div>
                    <div class="tri-chart" id="chart-glosa"></div>
                    <div class="tri-quarter-badges" id="badges-glosa"></div>
                </div>
            </div>

            <!-- Linha Inferior: 3 Cards (TOTAL, QTDE e RECUPERAÇÃO) -->
            <div class="row-bottom-3">
                <div class="tri-card" id="card-tri-total">
                    <div class="tri-card-header"><div class="tri-card-title">TOTAL</div><div class="badge-meta"><i class="fa-solid fa-trophy"></i> ALCANÇADO</div></div>
                    <div class="tri-chart" id="chart-total"></div>
                    <div class="tri-quarter-badges" id="badges-total"></div>
                </div>
                <div class="tri-card meta-batida" id="card-tri-qtde">
                    <div class="tri-card-header"><div class="tri-card-title">QTDE</div><div class="badge-meta"><i class="fa-solid fa-trophy"></i> ALCANÇADO</div></div>
                    <div class="tri-chart" id="chart-qtde"></div>
                    <div class="tri-quarter-badges" id="badges-qtde"></div>
                </div>
                <div class="tri-card meta-batida" id="card-tri-recuperacao">
                    <div class="tri-card-header"><div class="tri-card-title">RECUPERAÇÃO</div><div class="badge-meta"><i class="fa-solid fa-trophy"></i> ALCANÇADO</div></div>
                    <div class="tri-chart" id="chart-recuperacao"></div>
                    <div class="tri-quarter-badges" id="badges-recuperacao"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // DATASET TRIMESTRAL 100% FICTÍCIO (Convenio, Glosa, Total, Qtde, Recuperação)
        const METRICAS = {
            convenio: {
                title: "CONVÊNIO",
                data: { "1T": 99.97, "2T": 91.61, "3T": 86.42, "4T": 98.20 }
            },
            glosa: {
                title: "GLOSA",
                data: { "1T": 85.94, "2T": 86.60, "3T": 86.96, "4T": 89.40 }
            },
            total: {
                title: "TOTAL",
                data: { "1T": 93.46, "2T": 89.11, "3T": 86.69, "4T": 94.30 }
            },
            qtde: {
                title: "QTDE",
                data: { "1T": 122.85, "2T": 113.67, "3T": 102.52, "4T": 110.15 }
            },
            recuperacao: {
                title: "RECUPERAÇÃO",
                data: { "1T": 104.20, "2T": 106.80, "3T": 105.10, "4T": 107.50 }
            }
        };

        let currentTri = '3T'; // Default 3º TRI como na imagem enviada
        let chartInstances = {};
        let autoTvActive = true;
        let autoTvSeconds = 25;

        function getGaugeOption(percent) {
            const diff = percent - 100;
            const sign = diff >= 0 ? '+' : '';
            const diffText = sign + diff.toFixed(1) + '%';
            const diffColor = diff >= 0 ? '#00d26a' : '#ff3b3b';

            return {
                series: [{
                    type: 'gauge',
                    startAngle: 180,
                    endAngle: 0,
                    min: 0,
                    max: 120,
                    splitNumber: 12,
                    radius: '100%',
                    center: ['50%', '58%'],
                    axisLine: {
                        lineStyle: {
                            width: 16,
                            color: [
                                [80 / 120, '#ff3b3b'],
                                [100 / 120, '#ffc107'],
                                [1, '#00d26a']
                            ]
                        }
                    },
                    pointer: {
                        icon: 'path://M12.8,0.7l12,40.1H0.7L12.8,0.7z',
                        length: '56%',
                        width: 5.5,
                        offsetCenter: [0, '-5%'],
                        itemStyle: { 
                            color: '#f5c518',
                            shadowColor: 'rgba(0,0,0,0.6)',
                            shadowBlur: 4
                        }
                    },
                    axisTick: { length: 5, lineStyle: { color: 'auto', width: 1.2 } },
                    splitLine: { length: 10, lineStyle: { color: 'auto', width: 2 } },
                    axisLabel: {
                        show: false
                    },
                    title: {
                        show: true,
                        offsetCenter: [0, '14%'],
                        fontSize: 20,
                        fontWeight: '800',
                        color: '#ffffff',
                        fontFamily: 'Montserrat'
                    },
                    detail: {
                        show: true,
                        fontSize: 12,
                        offsetCenter: [0, '32%'],
                        valueAnimation: true,
                        formatter: function() { return diffText; },
                        color: diffColor,
                        fontWeight: '700',
                        fontFamily: 'Montserrat'
                    },
                    data: [{
                        value: percent,
                        name: percent.toFixed(2) + '%'
                    }]
                }]
            };
        }
        function renderAll() {
            Object.keys(METRICAS).forEach(key => {
                const metric = METRICAS[key];
                const pct = metric.data[currentTri];
                const isHit = pct >= 100;

                const cardEl = document.getElementById(`card-tri-${key}`);
                if (cardEl) {
                    if (isHit) cardEl.classList.add('meta-batida');
                    else cardEl.classList.remove('meta-batida');
                }

                // Render Badges 1T, 2T, 3T, 4T
                const badgesContainer = document.getElementById(`badges-${key}`);
                if (badgesContainer) {
                    badgesContainer.innerHTML = ['1T', '2T', '3T', '4T'].map(t => {
                        let val = metric.data[t];
                        let cls = val >= 100 ? 'val-success' : (val >= 80 ? 'val-warning' : 'val-danger');
                        let sel = currentTri === t ? 'selected' : '';
                        return `
                            <div class="tri-pill ${sel}" onclick="selectQuarter('${t}')">
                                <span class="label">${t}</span>
                                <span class="val ${cls}">${val ? val.toFixed(2) + '%' : '—'}</span>
                            </div>
                        `;
                    }).join('');
                }

                // Render ECharts
                const chartDom = document.getElementById(`chart-${key}`);
                if (chartDom) {
                    if (!chartInstances[key]) {
                        chartInstances[key] = echarts.init(chartDom);
                    }
                    chartInstances[key].setOption(getGaugeOption(pct));
                }
            });
        }

        function selectQuarter(q) {
            currentTri = q;
            document.querySelectorAll('.btn-tri-sel').forEach(b => b.classList.remove('active'));
            if (q === '1T') document.getElementById('btn-tri-1').classList.add('active');
            else if (q === '2T') document.getElementById('btn-tri-2').classList.add('active');
            else if (q === '3T') document.getElementById('btn-tri-3').classList.add('active');
            else if (q === '4T') document.getElementById('btn-tri-4').classList.add('active');
            renderAll();
        }

        function updateAll() {
            renderAll();
        }

        function toggleAutoTV() {
            autoTvActive = !autoTvActive;
            const badge = document.getElementById('auto-tv-badge');
            const txt = document.getElementById('auto-tv-text');
            if (autoTvActive) {
                badge.style.borderColor = '#00d26a';
                badge.style.color = '#00d26a';
                txt.innerText = `AUTO-TV: ATIVA (${autoTvSeconds}s)`;
            } else {
                badge.style.borderColor = '#ff2424';
                badge.style.color = '#ff2424';
                txt.innerText = 'AUTO-TV: PAUSADA';
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('pt-BR');
            document.getElementById('date').innerText = now.toLocaleDateString('pt-BR');
        }

        window.addEventListener('resize', () => {
            Object.values(chartInstances).forEach(c => c && c.resize());
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderAll();
            setInterval(updateClock, 1000);
            updateClock();

            // Auto-TV (Trimestre -> Mapa Brasil)
            setInterval(() => {
                if (!autoTvActive) return;
                autoTvSeconds--;
                if (autoTvSeconds <= 0) {
                    autoTvSeconds = 25;
                    window.location.href = 'mapa_brasil.html';
                }
                const txt = document.getElementById('auto-tv-text');
                if (txt && autoTvActive) txt.innerText = `AUTO-TV: ATIVA (${autoTvSeconds}s)`;
            }, 1000);
        });
    </script>
</body>
</html>
